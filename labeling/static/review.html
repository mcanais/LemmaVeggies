<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shelf review</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #deddd8; --chip: #efeeea;
    --accent: #2f6fd6; --full: #2e9d5b; --half: #e0a21b; --empty: #d64541; --wrong: #c026d3;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171716; --panel: #222220; --text: #ecebe6; --muted: #9b9a94; --line: #3a3a37; --chip: #2d2d2a; --accent: #6aa0ff; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; font: 14px/1.35 -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; }
  header { display: flex; gap: 10px; align-items: center; padding: 8px 16px; background: var(--panel);
    border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0 6px 0 0; white-space: nowrap; }
  select, button { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 8px; }
  button { cursor: pointer; }
  .progress { flex: 1; min-width: 80px; height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--accent); transition: width .2s; }
  .muted { color: var(--muted); }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 12px; padding: 12px; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-height: 0; }
  .left { display: flex; flex-direction: column; gap: 6px; }
  .title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .title strong { font-size: 15px; }
  .stage { position: relative; align-self: center; width: 100%; max-height: calc(100vh - 150px); aspect-ratio: 16 / 9; }
  .stage img { width: 100%; height: 100%; display: block; border-radius: 6px; }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stage polygon { cursor: pointer; }
  .keys { font-size: 12px; color: var(--muted); }
  kbd { font: 11px ui-monospace, monospace; background: var(--chip); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  .right { display: flex; flex-direction: column; gap: 8px; }
  #crop { display: block; width: 100%; height: 260px; object-fit: contain; background: #000; border-radius: 6px; }
  .card-area { flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 4px 2px; }
  .anav { display: flex; align-items: center; justify-content: space-between; color: var(--muted); }
  .anav button { padding: 2px 12px; }
  .pname { font-size: 18px; font-weight: 600; line-height: 1.25; }
  .big { display: grid; gap: 6px; }
  .big.three { grid-template-columns: repeat(3, 1fr); }
  .big.two { grid-template-columns: repeat(2, 1fr); }
  .big button { padding: 10px 4px; font-size: 15px; }
  .big button kbd { margin-right: 6px; }
  .big button.on { color: #fff; border-color: transparent; font-weight: 700; }
  .big button.on kbd { background: rgba(0,0,0,.2); border-color: transparent; color: #fff; }
  #unsureBtn.on { background: var(--half); color: #000; border-color: transparent; font-weight: 700; }
  .last { font-size: 13px; color: var(--accent); min-height: 1.3em; }
  .actions { display: flex; gap: 6px; }
  .actions .save { flex: 1; background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; padding: 7px; }
  dialog { max-width: 720px; width: calc(100% - 32px); background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; }
  dialog pre { white-space: pre-wrap; font: 13px/1.5 -apple-system, system-ui, sans-serif; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
    padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: .92; }
</style>
</head>
<body>
<header>
  <h1>Shelf review</h1>
  <select id="camera"></select>
  <select id="filter">
    <option value="suggested">Suggested (3 per camera)</option>
    <option value="todo">To review</option>
    <option value="all">All images</option>
  </select>
  <div class="progress"><div id="bar"></div></div>
  <span id="pct" class="muted"></span>
  <button id="guideBtn" title="Labelling guide">Guide <kbd>?</kbd></button>
</header>

<main>
  <section class="card left">
    <div class="title"><strong id="imgTitle"></strong><span class="muted" id="pos"></span></div>
    <div class="stage">
      <img id="photo" alt="Camera image">
      <svg id="overlay" viewBox="0 0 1280 720" preserveAspectRatio="none"></svg>
    </div>
    <div class="keys">
      <kbd>↑</kbd><kbd>↓</kbd> area · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> empty/half/full (moves on) ·
      <kbd>X</kbd> wrong product · <kbd>C</kbd> correct · <kbd>U</kbd> unsure ·
      <kbd>⏎</kbd> save image &amp; next · <kbd>←</kbd><kbd>→</kbd> previous/next image without saving
    </div>
  </section>

  <section class="card right">
    <img id="crop" alt="Crop of the selected area">
    <div class="card-area" id="area"></div>
    <div class="actions">
      <button id="prevBtn" title="Previous image (←)">←</button>
      <button class="save" id="saveBtn">Save image &amp; next ⏎</button>
      <button id="nextBtn" title="Next image (→)">→</button>
    </div>
  </section>
</main>

<dialog id="guide"><pre id="guideText"></pre><button onclick="this.parentElement.close()">Close</button></dialog>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const LEVELS = ["empty", "half", "full"];
const COLOR = { empty: "var(--empty)", half: "var(--half)", full: "var(--full)" };
let D, view = [], pos = 0, rows = [], sel = 0;

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const keyOf = (cam, img, area) => `${cam}/${img}/${area}`;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1500);
}

const isSuggested = ([cam, img]) => D.suggestedSet.has(`${cam}/${img}`);
const reviewed = ([cam, img]) => D.planogram[cam].every(a => D.human[keyOf(cam, img, a.area_id)]);

async function load() {
  D = await (await fetch("/api/data")).json();
  const cams = [...new Set(D.images.map(x => x[0]))];
  $("camera").innerHTML = '<option value="">All cameras</option>' + cams.map(c => `<option>${c}</option>`).join("");
  $("guideText").textContent = D.guide;
  $("camera").value = store.get("camera") || "";
  D.suggestedSet = new Set(D.suggested.map(([c, i]) => `${c}/${i}`));
  $("filter").value = ["suggested", "todo", "all"].includes(store.get("filter")) ? store.get("filter") : "suggested";
  applyFilter();
}

function applyFilter() {
  const cam = $("camera").value, f = $("filter").value;
  view = D.images.filter(im => (!cam || im[0] === cam) &&
    (f === "all" || (!reviewed(im) && (f === "todo" || isSuggested(im)))));
  pos = Math.min(pos, Math.max(view.length - 1, 0));
  openImage();
}

function openImage() {
  const sugg = $("filter").value === "suggested";
  const scope = D.images.filter(im => (!$("camera").value || im[0] === $("camera").value) && (!sugg || isSuggested(im)));
  const done = scope.filter(reviewed).length;
  $("bar").style.width = scope.length ? (100 * done / scope.length) + "%" : "0";
  $("pct").textContent = `${done}/${scope.length} ${sugg ? "suggested " : ""}images reviewed`;

  const im = view[pos];
  if (!im) {
    rows = []; $("imgTitle").textContent = "Nothing left in this filter"; $("pos").textContent = "";
    $("overlay").innerHTML = ""; $("area").innerHTML = "";
    $("photo").hidden = $("crop").hidden = true;
    return;
  }
  const [cam, img] = im;
  $("photo").hidden = $("crop").hidden = false;
  rows = D.planogram[cam].map(a => {
    // Unsaved areas start as "half, correct product"; you confirm or change them.
    const h = D.human[keyOf(cam, img, a.area_id)];
    return {
      ...a, saved: !!h,
      stock: h ? h.stock_level : "half",
      comp: h ? h.planogram_compliant : true,
      unsure: !!(h && h.unsure),
    };
  });
  sel = 0;
  const time = new Date(parseInt(img) * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  $("imgTitle").textContent = `Camera ${cam} · ${time}${reviewed(im) ? " · saved ✓" : ""}`;
  $("pos").textContent = `${pos + 1} / ${view.length}`;
  $("photo").src = `/image/${cam}/${img}`;
  renderArea();
}

function renderArea() {
  const r = rows[sel];
  if (!r) { $("area").innerHTML = ""; return; }
  const on = (cond, color) => cond ? `class="on" style="background:${color}"` : "";
  $("area").innerHTML = `
    <div class="anav">
      <button data-go="-1" title="Previous area (↑)" ${sel === 0 ? "disabled" : ""}>‹</button>
      <span>Area <strong>${r.area_id.split("_")[1]}</strong> · ${sel + 1} of ${rows.length}</span>
      <button data-go="1" title="Next area (↓)" ${sel === rows.length - 1 ? "disabled" : ""}>›</button>
    </div>
    <div>
      <div class="pname">${esc(r.product_name)}</div>
      <div class="muted">${esc(r.area_id)} · planogram product</div>
    </div>
    <div class="big three">${LEVELS.map((l, j) =>
      `<button data-stock="${l}" ${on(r.stock === l, COLOR[l])}><kbd>${j + 1}</kbd>${l}</button>`).join("")}</div>
    <div class="big two">
      <button data-comp="true" ${on(r.comp, "var(--full)")}><kbd>C</kbd>correct product</button>
      <button data-comp="false" ${on(!r.comp, "var(--wrong)")}><kbd>X</kbd>wrong product</button>
    </div>
    <div><button id="unsureBtn" data-unsure class="${r.unsure ? "on" : ""}"><kbd>U</kbd>unsure</button></div>
    <div class="last">${sel === rows.length - 1 ? "Last area: press Enter to save this image" : ""}</div>`;
  drawOverlay();
  $("crop").src = `/crop/${view[pos][0]}/${view[pos][1]}/${r.area_id}`;
}

// Outline every area so you can click it, but only highlight the one being labelled.
function drawOverlay() {
  const svg = $("overlay"), NS = "http://www.w3.org/2000/svg";
  svg.innerHTML = "";
  rows.forEach((r, i) => {
    const cur = i === sel;
    const poly = document.createElementNS(NS, "polygon");
    poly.setAttribute("points", r.polygon.map(q => q.join(",")).join(" "));
    poly.setAttribute("fill", cur ? "var(--accent)" : "transparent");
    poly.setAttribute("fill-opacity", cur ? .15 : 0);
    poly.setAttribute("stroke", cur ? "var(--accent)" : "rgba(255,255,255,.55)");
    poly.setAttribute("stroke-width", cur ? 6 : 1.5);
    poly.addEventListener("click", () => select(i));
    svg.appendChild(poly);
    const t = document.createElementNS(NS, "text");
    t.setAttribute("x", r.polygon.reduce((s, q) => s + q[0], 0) / 4);
    t.setAttribute("y", r.polygon.reduce((s, q) => s + q[1], 0) / 4 + 9);
    t.setAttribute("text-anchor", "middle"); t.setAttribute("font-size", cur ? 30 : 20); t.setAttribute("font-weight", 700);
    t.setAttribute("fill", "#fff"); t.setAttribute("stroke", "#000"); t.setAttribute("stroke-width", 1.2);
    t.setAttribute("fill-opacity", cur ? 1 : .7);
    t.setAttribute("pointer-events", "none");
    t.textContent = r.area_id.split("_")[1];
    svg.appendChild(t);
  });
}

function select(i) { sel = Math.max(0, Math.min(rows.length - 1, i)); renderArea(); }
function setStock(l, advance) { rows[sel].stock = l; if (advance && sel < rows.length - 1) sel++; renderArea(); }
function setComp(v) { rows[sel].comp = v; renderArea(); }

async function save() {
  const im = view[pos];
  if (!im) return;
  const [cam, img] = im;
  const areas = rows.map(r => ({
    area_id: r.area_id, stock_level: r.stock, planogram_compliant: r.comp,
    unsure: r.unsure,
  }));
  const res = await fetch("/api/labels", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ camera: cam, image: img, areas }) });
  const out = await res.json();
  if (!res.ok) return toast("Not saved: " + out.error);
  for (const l of out.labels) D.human[keyOf(cam, img, l.area_id)] = l;
  toast(`Saved ${areas.length} areas`);
  if ($("filter").value !== "all") view.splice(pos, 1);
  else pos++;
  pos = Math.min(pos, Math.max(view.length - 1, 0));
  openImage();
}

function move(d) { const p = pos + d; if (p >= 0 && p < view.length) { pos = p; openImage(); } }

$("area").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  b.blur();
  if (b.dataset.go) return select(sel + +b.dataset.go);
  if (b.dataset.stock) return setStock(b.dataset.stock, false);
  if (b.dataset.comp) return setComp(b.dataset.comp === "true");
  if ("unsure" in b.dataset) { rows[sel].unsure = !rows[sel].unsure; renderArea(); }
});
$("saveBtn").onclick = save;
$("prevBtn").onclick = () => move(-1);
$("nextBtn").onclick = () => move(1);
$("guideBtn").onclick = () => $("guide").showModal();
$("camera").onchange = () => { store.set("camera", $("camera").value); pos = 0; applyFilter(); };
$("filter").onchange = () => { store.set("filter", $("filter").value); pos = 0; applyFilter(); };

document.addEventListener("keydown", e => {
  if (document.activeElement.tagName === "SELECT" || e.metaKey || e.ctrlKey || e.altKey || !rows.length && e.key !== "?") return;
  const k = e.key.toLowerCase();
  if (k >= "1" && k <= "3") setStock(LEVELS[+k - 1], true);
  else if (k === "arrowdown") select(sel + 1);
  else if (k === "arrowup") select(sel - 1);
  else if (k === "c") setComp(true);
  else if (k === "x") setComp(false);
  else if (k === "u") { rows[sel].unsure = !rows[sel].unsure; renderArea(); }
  else if (k === "enter") save();
  else if (k === "arrowleft") move(-1);
  else if (k === "arrowright") move(1);
  else if (k === "?") $("guide").showModal();
  else return;
  e.preventDefault();
});

load();
</script>
</body>
</html>
